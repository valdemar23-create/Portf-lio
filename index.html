/* ---------------------------------------------------------------------
   15. PÁGINA: PERFORMANCE
   --------------------------------------------------------------------- */
function renderPerformance(root){
  const series = computeMonthlySeries();
  const assetMetrics = computeAllAssetMetrics();
  const summary = computePortfolioSummary(assetMetrics);
  // CORREÇÃO DE AUDITORIA: "melhor mês" / "pior mês" usa agora a mesma fórmula (só rendimentos, nunca
  // reforços/levantamentos) da Análise Mensal e do Dashboard — ver computeMonthlyAnalysis. Anteriormente
  // comparava valores de "património" consecutivos que, para meses passados, são uma aproximação baseada
  // em capital investido; isso fazia um reforço grande parecer, incorretamente, um "mês excelente".
  const monthlyRowsWithData = computeAllMonthlyRows().filter(r=>r.hasData);
  const bestMonth = monthlyRowsWithData.length ? monthlyRowsWithData.reduce((a,b)=> b.rentabilidade>a.rentabilidade?b:a) : null;
  const worstMonth = monthlyRowsWithData.length ? monthlyRowsWithData.reduce((a,b)=> b.rentabilidade<a.rentabilidade?b:a) : null;
  const bestWorstTip = 'Baseado apenas nos rendimentos (juros e dividendos) recebidos nesse mês, em relação ao capital já investido antes dele — nunca inclui reforços nem levantamentos feitos nesse mês, para não confundir dinheiro novo com ganho ou perda.';
  const maxWealth = series.length ? Math.max(...series.map(s=>s.current)) : 0;
  const minWealth = series.length ? Math.min(...series.map(s=>s.current)) : 0;
  const dd = computeDrawdown(series);
  const bestAsset = assetMetrics.length ? assetMetrics.reduce((a,b)=> b.gainLoss>a.gainLoss?b:a) : null;
  const worstAsset = assetMetrics.length ? assetMetrics.reduce((a,b)=> b.gainLoss<a.gainLoss?b:a) : null;
  const portfolioXirr = computePortfolioXirr(assetMetrics);

  root.innerHTML = `
    <div class="grid grid-stats" style="margin-bottom:14px;">
      <div class="card stat-card"><div class="stat-label">Rentabilidade total</div><div class="stat-value ${summary.totalReturnPct>=0?'pos':'neg'}">${fmtPct(summary.totalReturnPct)}</div></div>
      <div class="card stat-card"><div class="stat-label">XIRR anualizado <span class="tooltip-i" data-tip="Rentabilidade anualizada do portfólio ponderada pelas datas exatas de cada fluxo de caixa (entradas, saídas, valor atual). É o indicador mais rigoroso desta aplicação porque, ao contrário dos indicadores mensais/anuais, tem sempre em conta corretamente quando é que cada reforço ou levantamento aconteceu.">i</span></div><div class="stat-value ${portfolioXirr!==null && portfolioXirr>=0?'pos':(portfolioXirr!==null?'neg':'')}">${portfolioXirr!==null?fmtPct(portfolioXirr):'—'}</div></div>
      <div class="card stat-card"><div class="stat-label">Melhor mês <span class="tooltip-i" data-tip="${bestWorstTip}">i</span></div><div class="stat-value pos">${bestMonth?fmtPct(bestMonth.rentabilidade):'—'}</div><div class="stat-sub neu">${bestMonth?fmtMonthLabel(bestMonth.mk):''}</div></div>
      <div class="card stat-card"><div class="stat-label">Pior mês <span class="tooltip-i" data-tip="${bestWorstTip}">i</span></div><div class="stat-value neg">${worstMonth?fmtPct(worstMonth.rentabilidade):'—'}</div><div class="stat-sub neu">${worstMonth?fmtMonthLabel(worstMonth.mk):''}</div></div>
      <div class="card stat-card"><div class="stat-label">Património máximo</div><div class="stat-value">${fmtMoney(maxWealth)}</div></div>
      <div class="card stat-card"><div class="stat-label">Património mínimo</div><div class="stat-value">${fmtMoney(minWealth)}</div></div>

function computePortfolioXirr(assetMetrics){
  let flows = [];
  assetMetrics.forEach(m=> flows = flows.concat(m.flows));
  flows.sort((a,b)=>a.date.localeCompare(b.date));
  // agrega fluxos por data para estabilidade numérica
  const byDate = {};
  flows.forEach(f=>{ byDate[f.date] = (byDate[f.date]||0) + f.amount; });
  const agg = Object.keys(byDate).sort().map(d=>({date:d, amount:byDate[d]}));
  return computeXIRR(agg);
}

/* CORREÇÃO DE AUDITORIA — comparação com benchmark:
   A versão anterior comparava o portfólio "indexado a 100" (que para meses passados é uma aproximação de
   capital investido, não de valor de mercado) com o benchmark "indexado a 100" — isto fazia o simples ato
   de reforçar a carteira parecer "bater o mercado", o que é exatamente o tipo de erro que esta auditoria
   pretende eliminar. A nova abordagem simula, em euros reais, quanto valeria HOJE o mesmo dinheiro, investido
   exatamente nas mesmas datas e nos mesmos montantes, se tivesse sido colocado no índice em vez de na
   carteira real — comparável diretamente com o valor atual real da carteira (que esse sim é sempre exato). */
function computeBenchmarkTrajectory(benchKey){
  const bench = (STATE.benchmarks[benchKey]||[]).slice().sort((a,b)=>a.month.localeCompare(b.month));
  if(!bench.length) return null;
  const benchMap = {}; bench.forEach(b=> benchMap[b.month]=b.value);
  const sortedBenchMonths = bench.map(b=>b.month);
  function priceForMonth(mk){
    if(benchMap[mk]!==undefined) return benchMap[mk];
    let best = null;
    for(let i=0;i<sortedBenchMonths.length;i++){ if(sortedBenchMonths[i]<=mk) best = benchMap[sortedBenchMonths[i]]; else break; }
    return best !== null ? best : benchMap[sortedBenchMonths[0]];
  }
  const series = computeMonthlySeries();
  if(!series.length) return null;
  const mvsByMonth = {};
  STATE.movements.filter(m=>ISO_DATE_RE.test(m.date)).forEach(m=>{
    const mk = monthKey(m.date);
    (mvsByMonth[mk] = mvsByMonth[mk] || []).push(m);
  });
  let units = 0;
  const points = series.map(pt=>{
    const monthMvs = mvsByMonth[pt.month] || [];
    const price = priceForMonth(pt.month);
    monthMvs.forEach(m=>{
      if(!price) return;
      // Simula comprar/vender unidades do índice com o mesmo montante e na mesma data do movimento real —
      // exatamente como se, em vez de investir na carteira, tivesse investido no benchmark.
      if(CONTRIB_TYPES.includes(m.type)) units += num(m.value)/price;
      else if(WITHDRAW_TYPES.includes(m.type)) units -= num(m.value)/price;
    });
    return { month: pt.month, label: pt.label, value: units * (price||0) };
  });
  const lastPrice = priceForMonth(series[series.length-1].month);
  return { points, finalValue: units*(lastPrice||0), units };
}
function drawBenchmarkChart(){
  destroyChart('benchmark');
  const c = chartColors();
  const ctx = document.getElementById('chartBenchmark');
  const summaryEl = document.getElementById('benchmarkSummary');
  const sp = computeBenchmarkTrajectory('SP500');
  const mw = computeBenchmarkTrajectory('MSCIWorld');
  const series = computeMonthlySeries();
  if((!sp && !mw) || !series.length){
    if(ctx) ctx.parentElement.innerHTML = emptyChartHTML('Sem valores de benchmark introduzidos. Adicione-os em Definições.');
    if(summaryEl) summaryEl.innerHTML = '';
    return;
  }
  const summary = computePortfolioSummary();
  if(summaryEl){
    const rows = [`<div class="kv-row"><span class="k">Valor atual real da carteira</span><span class="v">${fmtMoney(summary.totalCurrent)}</span></div>`];
    if(sp){
      const diff = summary.totalCurrent - sp.finalValue;
      rows.push(`<div class="kv-row"><span class="k">Se tivesse investido no S&amp;P 500 (mesmas datas/montantes)</span><span class="v">${fmtMoney(sp.finalValue)} <span class="${diff>=0?'pos':'neg'}">(${diff>=0?'+':''}${fmtMoney(diff)})</span></span></div>`);
    }
    if(mw){
      const diff = summary.totalCurrent - mw.finalValue;
      rows.push(`<div class="kv-row"><span class="k">Se tivesse investido no MSCI World (mesmas datas/montantes)</span><span class="v">${fmtMoney(mw.finalValue)} <span class="${diff>=0?'pos':'neg'}">(${diff>=0?'+':''}${fmtMoney(diff)})</span></span></div>`);
    }
    summaryEl.innerHTML = rows.join('');
  }
  if(!ctx) return;
  const datasets = [
    { label:'Capital investido (real)', data: series.map(s=>s.invested), borderColor:c.inkFaint, borderDash:[5,4], fill:false, tension:.25, pointRadius:0 },
  ];
  if(sp) datasets.push({ label:'Se investido no S&P 500', data: sp.points.map(p=>p.value), borderColor:c.palette[1], fill:false, tension:.25, pointRadius:0 });
  if(mw) datasets.push({ label:'Se investido no MSCI World', data: mw.points.map(p=>p.value), borderColor:c.palette[3], fill:false, tension:.25, pointRadius:0 });
  // Ponto único no valor atual REAL da carteira, apenas no último mês, para dar uma referência honesta de comparação
  const realValuePoints = series.map((s,i)=> i===series.length-1 ? summary.totalCurrent : null);
  datasets.push({ label:'Valor atual real da carteira (hoje)', data: realValuePoints, borderColor:c.accent, backgroundColor:c.accent, pointRadius:5, pointHoverRadius:6, showLine:false });
  CHART_REGISTRY['benchmark'] = safeMakeChart(ctx, { type:'line', data:{ labels: series.map(s=>s.label), datasets }, options: baseChartOptions(c,{currency:true}) });
}

/* Cartões de estatísticas — recalculados sempre que o período do seletor muda, para nunca mostrarem um
   total diferente do que o gráfico por baixo está a apresentar. */
function renderIncomeStats(){
  const wrap = document.getElementById('incomeStatsWrap');
  if(!wrap) return;
  const range = INCOME_CHART_RANGE;
  const series = seriesForIncomeRange(range);
  const isFullRange = range === 'all';

  const interest = series.reduce((s,x)=>s+x.interest,0);
  const bonus = series.reduce((s,x)=>s+x.bonus,0);
  const total = dividends+interest+bonus;
  const avgMonthly = series.length ? total/series.length : 0;
  const lastMonthTotal = series.length ? (series[series.length-1].dividends+series[series.length-1].interest+series[series.length-1].bonus) : 0;
  wrap.innerHTML = `
    <div class="card stat-card"><div class="stat-label">Dividendos recebidos${suffix}</div><div class="stat-value">${fmtMoney(dividends)}</div></div>

function renderCalendar(){
  const monthNames = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  document.getElementById('calLabel').textContent = `${monthNames[CAL_MONTH]} ${CAL_YEAR}`;
  const first = new Date(CAL_YEAR, CAL_MONTH, 1);
  const startOffset = (first.getDay()+6)%7; // segunda=0
  const daysInMonth = new Date(CAL_YEAR, CAL_MONTH+1, 0).getDate();
  const events = {};
  STATE.movements.forEach(m=>{
    if((m.type==='Dividendo'||m.type==='Juro'||m.type===BONUS_TYPE) && m.date.startsWith(`${CAL_YEAR}-${String(CAL_MONTH+1).padStart(2,'0')}`)){
      const day = parseInt(m.date.slice(8,10));
      events[day] = events[day] || [];
      events[day].push(m);
    }
  });
  STATE.assets.filter(a=>a.classId==='deposito' && a.extra && a.extra.dataVencimento && a.extra.dataVencimento.startsWith(`${CAL_YEAR}-${String(CAL_MONTH+1).padStart(2,'0')}`)).forEach(a=>{
    const day = parseInt(a.extra.dataVencimento.slice(8,10));
    events[day] = events[day] || [];
    events[day].push({type:'Vencimento', value:0, notes:a.name});
  });
  const grid = document.getElementById('calGrid');
  let html = '';
  for(let i=0;i<startOffset;i++) html += `<div class="calendar-cell empty"></div>`;
  const todayStr = todayISO();
  for(let d=1; d<=daysInMonth; d++){
    const iso = `${CAL_YEAR}-${String(CAL_MONTH+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const evs = events[d] || [];
    html += `<div class="calendar-cell ${iso===todayStr?'today':''}" ${evs.length?`data-day="${d}"`:''}>
      <div class="day-num">${d}</div>
      ${evs.slice(0,3).map(e=>{
        const dotColor = e.type==='Dividendo'?'#1E4FA0':e.type==='Juro'?'#0E6E5C':e.type==='Bónus'?'#9A5B10':e.type==='Vencimento'?'#B5811F':'#5B6472';
        return `<div style="font-size:10px;margin-top:1px;"><span class="cal-dot" style="background:${dotColor}"></span>${e.type}</div>`;
      }).join('')}
    </div>`;
  }
  grid.innerHTML = html;
  grid.querySelectorAll('[data-day]').forEach(cell=>{
    cell.onclick = ()=>{
      const day = cell.dataset.day;
      const evs = events[day] || [];
      openModal(`<div class="modal-header"><h3>${day} de ${['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'][CAL_MONTH]}</h3><button class="modal-close">${icon('x',18)}</button></div>
      <div class="modal-body">${evs.map(e=>`<div class="alert-item ${e.type==='Vencimento'?'warn':''}">${e.type}${e.value?': '+fmtMoney(e.value):''} ${e.notes?'— '+escapeHtml(e.notes):''}</div>`).join('')}</div>
      <div class="modal-footer"><button class="btn" id="calClose">Fechar</button></div>`);
      document.getElementById('calClose').onclick = closeModal;
    };
  });
}

}
function reinforcementForMonth(mk){
  return STATE.movements.filter(m=>CONTRIB_TYPES.includes(m.type) && monthKey(m.date)===mk).reduce((s,m)=>s+num(m.value),0);
}
function currentMonthReinforcement(){ return reinforcementForMonth(monthKey(todayISO())); }
function renderGoalsGrid(summary, currentMonthlyIncome){
  const wrap = document.getElementById('goalsWrap');
  if(!STATE.goals.length){
    wrap.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><div class="icon">🎯</div><h4>Ainda não definiu objetivos</h4><p>Crie metas como "chegar aos €10.000" ou "receber €100/mês em rendimentos".</p></div>`;
    return;
  }
  wrap.innerHTML = STATE.goals.map(g=>{
    const current = g.type==='patrimonio' ? summary.totalCurrent : currentMonthlyIncome;
    const pct = g.target>0 ? clamp((current/g.target)*100,0,100) : 0;
    const remaining = Math.max(0, g.target-current);
    return `<div class="card">
      <div class="card-header-row"><h2 style="font-size:14px;">${escapeHtml(g.name)}</h2>
        <div><button class="btn btn-sm btn-icon" data-edit-goal="${g.id}">${icon('edit',13)}</button><button class="btn btn-sm btn-icon" data-del-goal="${g.id}">${icon('trash',13)}</button></div>
      </div>
      <div class="kv-list">
        <div class="kv-row"><span class="k">Valor atual</span><span class="v">${g.type==='patrimonio'?fmtMoney(current):fmtMoney(current)+'/mês'}</span></div>
        <div class="kv-row"><span class="k">Objetivo</span><span class="v">${g.type==='patrimonio'?fmtMoney(g.target):fmtMoney(g.target)+'/mês'}</span></div>

function handleImportFile(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    let data;
    try{ data = JSON.parse(ev.target.result); }
    catch(err){ toast('Ficheiro inválido. Certifique-se que é um backup JSON exportado por esta aplicação.','err'); return; }
    if(!data || !Array.isArray(data.assets) || !Array.isArray(data.movements)){
      toast('Estrutura de dados não reconhecida.','err'); return;
    }
    openModal(`
      <div class="modal-header"><h3>Importar backup</h3><button class="modal-close">${icon('x',18)}</button></div>
      <div class="modal-body">
        <p style="font-size:13.5px;">Encontrámos ${data.assets.length} ativo(s) e ${data.movements.length} movimento(s) neste ficheiro. Como pretende importar?</p>
      </div>
      <div class="modal-footer">
        <button class="btn" id="impCancel">Cancelar</button>
        <button class="btn" id="impMerge">Adicionar aos dados existentes</button>
        <button class="btn btn-danger" id="impReplace">Substituir dados existentes</button>
      </div>`);
    document.getElementById('impCancel').onclick = closeModal;
    document.getElementById('impReplace').onclick = ()=>{
      STATE = Object.assign(emptyState(), data); STATE.isDemo=false; sanitizeState(); saveState(); closeModal(); toast('Dados importados (substituídos).','ok'); navigate('dashboard');
    };
    document.getElementById('impMerge').onclick = ()=>{
      const idMap = {};
      (data.classes||[]).forEach(c=>{ if(!STATE.classes.some(ec=>ec.id===c.id)) STATE.classes.push(c); });
      (data.assets||[]).forEach(a=>{ const newId=uid('asset'); idMap[a.id]=newId; STATE.assets.push(Object.assign({},a,{id:newId})); });
      (data.movements||[]).forEach(m=> STATE.movements.push(Object.assign({},m,{id:uid('mv'), assetId: idMap[m.assetId]||m.assetId})));
      (data.valuations||[]).forEach(v=> STATE.valuations.push(Object.assign({},v,{id:uid('val'), assetId: idMap[v.assetId]||v.assetId})));
      (data.goals||[]).forEach(g=> STATE.goals.push(Object.assign({},g,{id:uid('goal')})));
      STATE.isDemo=false; sanitizeState(); saveState(); closeModal(); toast('Dados importados (adicionados).','ok'); navigate('dashboard');
    };
  };
  reader.readAsText(file);
  e.target.value = '';
}

function initApp(){

    loadState();

    window.addEventListener('resize', ()=>{
      if(window.innerWidth > 900){
        document.getElementById('sidebar').classList.remove('open');
        document.getElementById('sidebarScrim').classList.remove('open');
      }
    });
  }catch(err){
    console.error('Falha crítica ao iniciar a aplicação:', err);
    document.getElementById('app').innerHTML = `
      <div style="max-width:560px;margin:8vh auto;padding:0 20px;font-family:system-ui,sans-serif;">
        <div style="background:#fff;border:1px solid #E2E5EA;border-radius:14px;padding:28px;text-align:center;">
          <div style="font-size:32px;margin-bottom:10px;">⚠️</div>
          <h2 style="margin:0 0 8px;font-size:18px;">A aplicação não conseguiu iniciar</h2>
          <p style="color:#4B5567;font-size:13.5px;line-height:1.6;">
            Isto acontece normalmente se o ficheiro Chart.js não conseguiu ser carregado a partir do CDN
            (por exemplo, sem ligação à internet no momento da abertura). Verifique a sua ligação e recarregue a página.
          </p>
          <p style="font-family:ui-monospace,monospace;font-size:11.5px;color:#B5432F;background:#FBEAE6;padding:10px;border-radius:8px;margin-top:14px;text-align:left;">${escapeHtml(err.message)}</p>
          <button onclick="location.reload()" style="margin-top:16px;padding:9px 18px;border-radius:8px;border:1px solid #0E6E5C;background:#0E6E5C;color:#fff;font-weight:600;cursor:pointer;">Recarregar página</button>
        </div>
      </div>`;
  }
}

document.addEventListener('DOMContentLoaded', initApp);

// Registo do service worker (PWA): permite instalar a app e abrir offline depois da primeira
// visita. Só funciona quando a página é servida via http(s) — não corre em file:// nem afeta
// em nada o funcionamento normal da app caso falhe (é envolto em try/catch e feature-detect).
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () { /* silencioso: app funciona na mesma */ });
  });
}
</script>
</body>
</html>
