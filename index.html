<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Portfólio Financeiro</title>

<!-- PWA: permite "Adicionar ao ecrã principal" / instalar como aplicação, com ícone próprio
     e sem a barra de endereço do browser, e ativa o cache offline via service worker. -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Portfólio">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png" type="image/png">
<!-- Chart.js carregado de forma NÃO bloqueante (async): a interface (sidebar, cartões, tabelas, valores)
     aparece imediatamente, mesmo em ligações lentas ou sem rede, sem esperar por este ficheiro nem pelo
     evento DOMContentLoaded. Os gráficos ficam disponíveis assim que a biblioteca terminar de carregar
     (ver __chartLoaded() mais abaixo); se falhar, cada gráfico mostra um aviso em vez de travar a aplicação.
     Não são usadas fontes externas (Google Fonts) precisamente para que a app abra sempre rápido e funcione
     também offline depois da primeira abertura. -->
<script async src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"
  onload="window.__chartLoaded && window.__chartLoaded();"
  onerror="this.onerror=null;var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js';s.onload=function(){window.__chartLoaded && window.__chartLoaded();};document.head.appendChild(s);"></script>
<style>
/* ============================================================
   DESIGN TOKENS
   Paleta: fundo neutro frio, tinta profunda como texto,
   acento esmeralda/petróleo para ações e positivos,
   vermelho terracota abafado para negativos.
   Tipografia: fontes nativas do sistema operativo (sem pedidos de rede a
   Google Fonts), com uma família tabular para os números — dá um ar de
   "livro-razão" / terminal, apropriado a finanças, e garante que a app
   abre instantaneamente mesmo offline ou com ligação lenta.
   ============================================================ */
:root{
  --bg:#F5F6F8;
  --bg-elevated:#FFFFFF;
  --bg-sunken:#ECEEF2;
  --ink:#111827;
  --ink-soft:#4B5567;
  --ink-faint:#8A93A3;
  --border:#E2E5EA;
  --border-strong:#CDD2DB;
  --accent:#0E6E5C;
  --accent-soft:#E4F2EE;
  --accent-ink:#08493D;
  --positive:#12805F;
  --positive-soft:#E3F3EC;
  --negative:#B5432F;
  --negative-soft:#FBEAE6;
  --warning:#B5811F;
  --warning-soft:#FBF1DE;
  --focus:#0E6E5C;
  --sidebar-bg:#111827;
  --sidebar-ink:#C9CFDA;
  --sidebar-ink-active:#FFFFFF;
  --sidebar-border:#1F2937;
  --radius-sm:6px;
  --radius-md:10px;
  --radius-lg:14px;
  --shadow-card:0 1px 2px rgba(17,24,39,.04), 0 1px 1px rgba(17,24,39,.03);
  --font-ui:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --font-num:ui-monospace,'SFMono-Regular','Cascadia Mono','Segoe UI Mono',Consolas,'Liberation Mono',Menlo,monospace;
}
:root[data-theme="dark"]{
  --bg:#0B0F17;
  --bg-elevated:#131A26;
  --bg-sunken:#0E141F;
  --ink:#EDEFF3;
  --ink-soft:#A9B1C0;
  --ink-faint:#6B7385;
  --border:#232B3A;
  --border-strong:#2E3745;
  --accent:#2FB495;
  --accent-soft:#12251F;
  --accent-ink:#7BE0C6;
  --positive:#2FB495;
  --positive-soft:#12251F;
  --negative:#E17A63;
  --negative-soft:#2A1712;
  --warning:#E0B655;
  --warning-soft:#2A2312;
  --sidebar-bg:#080B11;
  --sidebar-ink:#8B93A5;
  --sidebar-ink-active:#FFFFFF;
  --sidebar-border:#1A2029;
  --shadow-card:0 1px 2px rgba(0,0,0,.3);
}

*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  font-family:var(--font-ui);
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  font-size:14px;
  line-height:1.5;
}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;}
a{color:inherit;}
button{font-family:var(--font-ui);}
::selection{background:var(--accent-soft);color:var(--accent-ink);}

/* ---------- Layout shell ---------- */
#app{display:flex;min-height:100vh;}

.sidebar{
  width:236px;flex-shrink:0;background:var(--sidebar-bg);
  color:var(--sidebar-ink);display:flex;flex-direction:column;
  position:fixed;top:0;bottom:0;left:0;z-index:50;
  transition:transform .2s ease;
}
.sidebar-brand{
  display:flex;align-items:center;gap:10px;padding:20px 18px 14px 18px;
  border-bottom:1px solid var(--sidebar-border);
}
.sidebar-brand .mark{
  width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#2FB495,#0E6E5C);
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;
  font-family:var(--font-num);
}
.sidebar-brand .name{font-weight:700;color:#fff;font-size:14.5px;letter-spacing:.1px;}
.sidebar-brand .sub{font-size:11px;color:var(--sidebar-ink);margin-top:1px;}
.sidebar-nav{flex:1;overflow-y:auto;padding:10px 10px;}
.sidebar-section-label{font-size:10.5px;color:#5C6577;padding:14px 10px 6px;font-weight:600;}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;
  cursor:pointer;color:var(--sidebar-ink);font-size:13.5px;font-weight:500;margin-bottom:1px;
  border:none;background:none;width:100%;text-align:left;
}
.nav-item svg{width:17px;height:17px;flex-shrink:0;opacity:.85;}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav-item.active{background:rgba(47,180,149,.16);color:#fff;}
.nav-item.active svg{opacity:1;color:#3FCDA8;}
.sidebar-footer{padding:12px 16px 16px;border-top:1px solid var(--sidebar-border);font-size:10.5px;color:#5C6577;line-height:1.5;}

.main{margin-left:236px;flex:1;min-width:0;display:flex;flex-direction:column;min-height:100vh;}
.topbar{
  position:sticky;top:0;z-index:40;background:var(--bg);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:14px;padding:14px 28px;
  backdrop-filter:blur(6px);
}
.topbar-title{font-size:18px;font-weight:700;letter-spacing:-.2px;}
.topbar-sub{font-size:12px;color:var(--ink-faint);margin-top:1px;}
.topbar-spacer{flex:1;}
.menu-toggle{display:none;background:none;border:1px solid var(--border);border-radius:8px;padding:7px;cursor:pointer;color:var(--ink);}

.content{padding:24px 28px 60px;flex:1;}
.page{display:none;}
.page.active{display:block;animation:fadein .18s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(3px);}to{opacity:1;transform:none;}}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:6px;justify-content:center;
  font-size:13px;font-weight:600;padding:8px 14px;border-radius:8px;border:1px solid var(--border-strong);
  background:var(--bg-elevated);color:var(--ink);cursor:pointer;white-space:nowrap;
  transition:background .12s,border-color .12s;
}
.btn:hover{background:var(--bg-sunken);}
.btn:focus-visible{outline:2px solid var(--focus);outline-offset:1px;}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn-primary:hover{background:var(--accent-ink);border-color:var(--accent-ink);}
.btn-danger{background:var(--bg-elevated);border-color:var(--negative);color:var(--negative);}
.btn-danger:hover{background:var(--negative-soft);}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:6px;}
.btn-ghost{background:none;border-color:transparent;}
.btn-ghost:hover{background:var(--bg-sunken);}
.btn-icon{padding:7px;border-radius:7px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}

/* ---------- Cards / grid ---------- */
.grid{display:grid;gap:14px;}
.grid-stats{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));}
.grid-2{grid-template-columns:1fr 1fr;}
.grid-3{grid-template-columns:1fr 1fr 1fr;}
@media (max-width:1000px){.grid-2,.grid-3{grid-template-columns:1fr;}}

.card{
  background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:18px;box-shadow:var(--shadow-card);
}
.card-title{font-size:13px;font-weight:600;color:var(--ink-soft);margin:0 0 10px;display:flex;align-items:center;justify-content:space-between;}
.card-header-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;flex-wrap:wrap;}
.card-header-row h2{margin:0;font-size:15.5px;}

.stat-card{padding:16px 18px;}
.stat-label{font-size:12px;color:var(--ink-faint);font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:6px;}
.stat-value{font-family:var(--font-num);font-size:22px;font-weight:600;letter-spacing:-.3px;}
.stat-sub{font-size:12px;margin-top:5px;font-family:var(--font-num);font-weight:500;}
.stat-sub.pos{color:var(--positive);}
.stat-sub.neg{color:var(--negative);}
.stat-sub.neu{color:var(--ink-faint);}
.trend-pill{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:20px;}
.trend-pill.pos{background:var(--positive-soft);color:var(--positive);}
.trend-pill.neg{background:var(--negative-soft);color:var(--negative);}
.trend-pill.neu{background:var(--bg-sunken);color:var(--ink-faint);}

/* ---------- Tables ---------- */
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{
  text-align:left;font-size:11px;text-transform:none;color:var(--ink-faint);font-weight:600;
  padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none;
}
th span.arrow{opacity:.5;margin-left:3px;font-size:10px;}
td{padding:9px 10px;border-bottom:1px solid var(--border);white-space:nowrap;}
tbody tr:hover{background:var(--bg-sunken);}
/* Destaque visual dos movimentos de Depósito (entrada de dinheiro) e Levantamento (saída de dinheiro)
   na tabela de Movimentos, sem alterar a cor própria dos badges de classe nem dos botões de ação. */
tr.row-deposit td:not(.badge-cell):not(.actions-cell){ font-weight:700; color:var(--positive); }
tr.row-withdraw td:not(.badge-cell):not(.actions-cell){ font-weight:700; color:var(--negative); }
td.num,th.num{text-align:right;font-family:var(--font-num);}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;}
.badge-etf{background:#E3ECFB;color:#1E4FA0;}
.badge-p2p{background:#F3E8FB;color:#6C2FA6;}
.badge-ppr{background:#FBEFE0;color:#9A5B10;}
.badge-deposito{background:#E1F4EE;color:#0E6E5C;}
.badge-outro{background:var(--bg-sunken);color:var(--ink-soft);}
:root[data-theme="dark"] .badge-etf{background:#152238;color:#8FB6F5;}
:root[data-theme="dark"] .badge-p2p{background:#241a30;color:#CBA3EE;}
:root[data-theme="dark"] .badge-ppr{background:#2a2013;color:#E3B36A;}
:root[data-theme="dark"] .badge-deposito{background:#0f241d;color:#6FD9B8;}
:root[data-theme="dark"] .badge-outro{background:#1b2230;color:#A9B1C0;}

.pos{color:var(--positive);}
.neg{color:var(--negative);}
.muted{color:var(--ink-faint);}

/* ---------- Forms ---------- */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.form-grid.single{grid-template-columns:1fr;}
@media (max-width:640px){.form-grid{grid-template-columns:1fr;}}
.field{display:flex;flex-direction:column;gap:5px;}
.field.span2{grid-column:1/-1;}
.field label{font-size:12px;font-weight:600;color:var(--ink-soft);}
.field .hint{font-size:11px;color:var(--ink-faint);}
input[type=text],input[type=number],input[type=date],input[type=password],select,textarea{
  font-family:var(--font-ui);font-size:13.5px;padding:8px 10px;border-radius:8px;border:1px solid var(--border-strong);
  background:var(--bg-elevated);color:var(--ink);width:100%;
}
input.num-input{font-family:var(--font-num);}
textarea{resize:vertical;min-height:60px;}
input:focus,select:focus,textarea:focus{outline:2px solid var(--focus);outline-offset:0;border-color:var(--focus);}
.checkbox-row{display:flex;align-items:center;gap:8px;font-size:13px;}
.field-error{font-size:11.5px;color:var(--negative);min-height:14px;}
input.invalid,select.invalid{border-color:var(--negative);}

/* ---------- Modal ---------- */
.modal-overlay{
  position:fixed;inset:0;background:rgba(10,14,20,.5);display:none;align-items:flex-start;justify-content:center;
  z-index:100;padding:5vh 16px;overflow-y:auto;
}
.modal-overlay.open{display:flex;}
.modal{
  background:var(--bg-elevated);border-radius:var(--radius-lg);width:100%;max-width:560px;
  border:1px solid var(--border);box-shadow:0 20px 60px rgba(0,0,0,.25);
  animation:modalIn .15s ease;
}
.modal.wide{max-width:760px;}
@keyframes modalIn{from{opacity:0;transform:translateY(8px) scale(.98);}to{opacity:1;transform:none;}}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);}
.modal-header h3{margin:0;font-size:15.5px;}
.modal-body{padding:20px;max-height:70vh;overflow-y:auto;}
.modal-footer{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--border);}
.modal-close{background:none;border:none;cursor:pointer;color:var(--ink-faint);padding:4px;border-radius:6px;}
.modal-close:hover{background:var(--bg-sunken);color:var(--ink);}

/* ---------- Misc components ---------- */
.empty-state{
  text-align:center;padding:46px 20px;color:var(--ink-faint);
}
.empty-state .icon{font-size:30px;margin-bottom:10px;opacity:.5;}
.empty-state h4{margin:0 0 4px;color:var(--ink-soft);font-size:14px;}
.empty-state p{margin:0;font-size:12.5px;}

.toast-wrap{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{
  background:var(--ink);color:#fff;padding:11px 16px;border-radius:9px;font-size:13px;font-weight:500;
  box-shadow:0 8px 24px rgba(0,0,0,.2);display:flex;align-items:center;gap:8px;min-width:220px;
  animation:toastIn .18s ease;
}
:root[data-theme="dark"] .toast{background:#F5F6F8;color:#111827;}
.toast.err{background:var(--negative);}
.toast.ok{background:var(--positive);}
@keyframes toastIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

.tag-filter-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px;}
.tag-filter-bar select,.tag-filter-bar input{width:auto;min-width:130px;}
.chip{
  padding:6px 12px;border-radius:20px;border:1px solid var(--border-strong);background:var(--bg-elevated);
  font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink-soft);
}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent);}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;flex-wrap:wrap;}
.tab-btn{
  padding:9px 14px;font-size:13px;font-weight:600;color:var(--ink-faint);background:none;border:none;
  cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;
}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);}

.progress-bar{height:8px;border-radius:5px;background:var(--bg-sunken);overflow:hidden;}
.progress-bar > div{height:100%;background:var(--accent);border-radius:5px;transition:width .3s;}

.chart-box{position:relative;height:280px;}
.chart-box.tall{height:340px;}
.chart-box.short{height:200px;}

.tooltip-i{
  display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;
  background:var(--bg-sunken);color:var(--ink-faint);font-size:10px;font-weight:700;cursor:help;position:relative;
}
.tooltip-i:hover::after{
  content:attr(data-tip);position:absolute;bottom:130%;left:50%;transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:8px 10px;border-radius:7px;font-size:11.5px;font-weight:500;
  width:220px;white-space:normal;z-index:60;box-shadow:0 8px 20px rgba(0,0,0,.25);line-height:1.4;
}
:root[data-theme="dark"] .tooltip-i:hover::after{background:#F5F6F8;color:#111827;}

.section-divider{height:1px;background:var(--border);margin:22px 0;}
.footer-note{
  text-align:center;font-size:11.5px;color:var(--ink-faint);padding:24px 0 6px;
}
.footer-note svg{width:12px;height:12px;vertical-align:-1px;margin-right:4px;}

.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.calendar-cell{
  min-height:70px;border:1px solid var(--border);border-radius:8px;padding:6px;font-size:11px;background:var(--bg-elevated);
  cursor:pointer;
}
.calendar-cell.empty{background:transparent;border-color:transparent;cursor:default;}
.calendar-cell .day-num{font-weight:700;font-size:12px;margin-bottom:3px;}
.calendar-cell.today{border-color:var(--accent);}
.cal-dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:2px;}
.calendar-cell:hover:not(.empty){background:var(--bg-sunken);}
.calendar-weekday{font-size:11px;font-weight:700;color:var(--ink-faint);text-align:center;padding-bottom:4px;}

.demo-banner{
  background:var(--warning-soft);color:var(--warning);border:1px solid var(--warning);border-radius:10px;
  padding:10px 14px;font-size:12.5px;font-weight:600;margin-bottom:18px;display:flex;align-items:center;gap:8px;
}

.kv-list{display:flex;flex-direction:column;gap:8px;}
.kv-row{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-bottom:1px dashed var(--border);}
.kv-row .k{color:var(--ink-faint);}
.kv-row .v{font-family:var(--font-num);font-weight:600;}

.alert-item{
  display:flex;align-items:flex-start;gap:10px;padding:11px 12px;border-radius:9px;border:1px solid var(--border);
  margin-bottom:8px;font-size:12.5px;
}
.alert-item.crit{background:var(--negative-soft);border-color:var(--negative);}
.alert-item.warn{background:var(--warning-soft);border-color:var(--warning);}

@media (max-width:900px){
  .sidebar{transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0);}
  .main{margin-left:0;}
  .menu-toggle{display:inline-flex;align-items:center;}
  .content{padding:18px 14px 50px;}
  .topbar{padding:12px 14px;}
  .grid-stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));}
  .stat-value{font-size:19px;}
}
.sidebar-scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:45;display:none;}
.sidebar-scrim.open{display:block;}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast-wrap" id="toastWrap"></div>
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalBox"></div>
</div>
<div class="sidebar-scrim" id="sidebarScrim"></div>
<script>
/* =====================================================================
   PORTFÓLIO FINANCEIRO — aplicação local de gestão de património
   Ficheiro único, sem backend, sem dependências além de Chart.js (CDN).
   Todos os dados ficam apenas no localStorage deste browser.
   ===================================================================== */
'use strict';

/* ---------------------------------------------------------------------
   1. UTILITÁRIOS GERAIS
   --------------------------------------------------------------------- */
const STORAGE_KEY = 'pf_portfolio_data_v1';
const ISO_DATE_RE = /^\d{4}-\d{2}-\d{2}$/;

function uid(prefix){ return (prefix||'id') + '_' + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4); }
/* Formata uma data como YYYY-MM-DD usando os componentes LOCAIS (getFullYear/getMonth/getDate) — NUNCA
   toISOString(), que converte para UTC e pode "recuar" um dia em fusos horários com offset positivo em
   relação a UTC (como Portugal no horário de verão, ou qualquer fuso a Este de Greenwich) — bug real
   detetado nesta versão: causava a perda de meses inteiros nos gráficos de evolução para a generalidade
   dos utilizadores na Europa. */
function fmtLocalISO(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function todayISO(){ return fmtLocalISO(new Date()); }
/* Avança uma chave de mês "YYYY-MM" para o mês seguinte usando apenas aritmética inteira — nunca cria um
   objeto Date para este cálculo, precisamente para nunca reintroduzir o bug de fuso horário acima. */
function nextMonthKey(mk){
  let [y,m] = mk.split('-').map(Number);
  m += 1;
  if(m > 12){ m = 1; y += 1; }
  return `${y}-${String(m).padStart(2,'0')}`;
}
function clamp(n,min,max){ return Math.max(min,Math.min(max,n)); }
function num(v){ const n = typeof v === 'number' ? v : parseFloat(String(v).replace(',','.')); return isNaN(n) ? 0 : n; }
function monthKey(iso){ return (iso||'').slice(0,7); } // YYYY-MM
function daysBetween(a,b){ return (new Date(b) - new Date(a)) / 86400000; }

const CURRENCY_SYMBOLS = { EUR:'€', USD:'$', GBP:'£', CHF:'CHF' };

function fmtMoney(value, currency){
  currency = currency || (STATE && STATE.settings ? STATE.settings.baseCurrency : 'EUR');
  const sign = value < 0 ? '-' : '';
  const abs = Math.abs(value || 0);
  const formatted = abs.toLocaleString('pt-PT', {minimumFractionDigits:2, maximumFractionDigits:2});
  const symbol = CURRENCY_SYMBOLS[currency] || currency || '€';
  return `${sign}${symbol}\u00A0${formatted}`;
}
function fmtNumber(value, decimals){
  decimals = decimals === undefined ? 2 : decimals;
  return (value || 0).toLocaleString('pt-PT', {minimumFractionDigits:decimals, maximumFractionDigits:decimals});
}
function fmtPct(value, decimals){
  decimals = decimals === undefined ? 2 : decimals;
  const sign = value > 0 ? '+' : '';
  return `${sign}${(value||0).toLocaleString('pt-PT',{minimumFractionDigits:decimals,maximumFractionDigits:decimals})}%`;
}
function fmtDate(iso){
  if(!iso) return '—';
  const d = new Date(iso + 'T00:00:00');
  if(isNaN(d)) return iso;
  return d.toLocaleDateString('pt-PT', {day:'2-digit', month:'2-digit', year:'numeric'});
}
function fmtMonthLabel(mk){
  // mk = 'YYYY-MM'
  const [y,m] = mk.split('-');
  const d = new Date(parseInt(y), parseInt(m)-1, 1);
  return d.toLocaleDateString('pt-PT', {month:'short', year:'2-digit'}).replace('.','');
}
function escapeHtml(str){
  return String(str === undefined || str === null ? '' : str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function toast(msg, type){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast' + (type ? ' ' + type : '');
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .25s'; setTimeout(()=>el.remove(),250); }, 2800);
}

/* Newton-Raphson XIRR sobre séries de fluxos de caixa {date:'YYYY-MM-DD', amount:Number} */
function computeXIRR(flows){
  if(!flows || flows.length < 2) return null;
  const hasPos = flows.some(f=>f.amount>0), hasNeg = flows.some(f=>f.amount<0);
  if(!hasPos || !hasNeg) return null;
  const t0 = new Date(flows[0].date).getTime();
  const years = flows.map(f => (new Date(f.date).getTime() - t0) / (365.25*86400000));
  function npv(rate){
    let s = 0;
    for(let i=0;i<flows.length;i++){ s += flows[i].amount / Math.pow(1+rate, years[i]); }
    return s;
  }
  function dnpv(rate){
    let s = 0;
    for(let i=0;i<flows.length;i++){ s += -years[i]*flows[i].amount / Math.pow(1+rate, years[i]+1); }
    return s;
  }
  let rate = 0.1;
  for(let i=0;i<100;i++){
    const f = npv(rate), d = dnpv(rate);
    if(Math.abs(d) < 1e-10) break;
    const next = rate - f/d;
    if(!isFinite(next)) break;
    if(Math.abs(next-rate) < 1e-7){ rate = next; break; }
    rate = clamp(next, -0.9999, 10);
  }
  if(!isFinite(rate) || Math.abs(npv(rate)) > Math.max(1, Math.abs(flows[0].amount))*0.01) {
    // fallback bisseção
    let lo=-0.9, hi=5, flo=npv(lo), fhi=npv(hi);
    if(flo*fhi > 0) return rate*100;
    for(let i=0;i<200;i++){
      const mid=(lo+hi)/2, fmid=npv(mid);
      if(Math.abs(fmid) < 1e-6) return mid*100;
      if(flo*fmid < 0){ hi=mid; fhi=fmid; } else { lo=mid; flo=fmid; }
    }
    return ((lo+hi)/2)*100;
  }
  return rate*100;
}

function sanitizeState(){
  // Blinda a aplicação contra dados corrompidos ou mal formados (ex: vindos de uma importação antiga,
  // edição manual do localStorage, ou uma versão futura dos dados) — nunca deixa a app rebentar por
  // causa disto; em vez de apagar dados do utilizador, corrige o que for corrigível.

  // Migração one-off: quem já tinha dados guardados de uma versão anterior desta app tem a classe do
  // sistema "deposito" gravada com o nome antigo "Depósito". Atualiza-a automaticamente para o novo nome
  // "Cofre Pessoal" — mas só se ainda tiver exatamente o nome por omissão antigo, para nunca substituir
  // um nome que o próprio utilizador tenha escolhido manualmente para essa categoria.
  if(Array.isArray(STATE.classes)){
    const dep = STATE.classes.find(c=>c.id==='deposito');
    if(dep && dep.name === 'Depósito') dep.name = 'Cofre Pessoal';
  }
  if(Array.isArray(STATE.alerts)){
    const depAlert = STATE.alerts.find(a=>a.type==='deposit_maturity');
    if(depAlert && depAlert.label === 'Depósito a vencer em X dias') depAlert.label = 'Ativo do Cofre Pessoal a vencer em X dias';
  }

  if(!Array.isArray(STATE.assets)) STATE.assets = [];
  STATE.assets = STATE.assets.filter(a=> a && typeof a==='object' && a.id);
  STATE.assets.forEach(a=>{
    if(!ISO_DATE_RE.test(a.firstDate)) a.firstDate = todayISO();
    if(!a.classId) a.classId = STATE.classes[0] ? STATE.classes[0].id : 'outro';
    a.currentValue = num(a.currentValue);
    a.currentPrice = num(a.currentPrice);
    if(!a.extra || typeof a.extra !== 'object') a.extra = {};
  });
  const validAssetIds = new Set(STATE.assets.map(a=>a.id));
  if(!Array.isArray(STATE.movements)) STATE.movements = [];
  STATE.movements = STATE.movements
    .filter(m=> m && typeof m==='object' && validAssetIds.has(m.assetId))
    .map(m=>{
      if(!ISO_DATE_RE.test(m.date)) m.date = todayISO();
      if(!MOVEMENT_TYPES.includes(m.type)) m.type = 'Outro';
      if(!m.id) m.id = uid('mv');
      m.quantity = num(m.quantity); m.price = num(m.price); m.value = num(m.value); m.commission = num(m.commission);
      m.currency = CURRENCY_SYMBOLS[m.currency] ? m.currency : (STATE.settings.baseCurrency || 'EUR');
      return m;
    });

  // Histórico de valorização: uma entrada por (ativo, data); se houver duplicados para a mesma data
  // (ex: de uma importação), fica só a última. Nunca é tratado como movimento de dinheiro.
  if(!Array.isArray(STATE.valuations)) STATE.valuations = [];
  const valByKey = {};
  STATE.valuations
    .filter(v=> v && typeof v==='object' && validAssetIds.has(v.assetId) && ISO_DATE_RE.test(v.date))
    .forEach(v=>{
      if(!v.id) v.id = uid('val');
      v.value = num(v.value);
      valByKey[v.assetId+'|'+v.date] = v; // a última entrada processada vence, elimina duplicados
    });
  STATE.valuations = Object.values(valByKey);

  if(!Array.isArray(STATE.goals)) STATE.goals = [];
  if(!STATE.benchmarks || typeof STATE.benchmarks !== 'object') STATE.benchmarks = { SP500:[], MSCIWorld:[] };
  ['SP500','MSCIWorld'].forEach(k=>{ if(!Array.isArray(STATE.benchmarks[k])) STATE.benchmarks[k] = []; });
}

let STATE = null;

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      // merge de segurança com defaults, caso faltem campos de versões antigas
      STATE = Object.assign(emptyState(), parsed);
      STATE.settings = Object.assign(defaultSettings(), parsed.settings||{});
      STATE.settings.exchangeRates = Object.assign(defaultSettings().exchangeRates, (parsed.settings||{}).exchangeRates||{});
      if(!STATE.classes || !STATE.classes.length) STATE.classes = defaultClasses();
      if(!STATE.alerts || !STATE.alerts.length) STATE.alerts = defaultAlerts();
      sanitizeState();
      return;
    }
  }catch(e){ console.error('Falha ao ler dados guardados, a iniciar com dados de demonstração.', e); }
  STATE = buildDemoState();
  sanitizeState();
}
function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE));
  }catch(e){
    toast('Erro ao guardar dados localmente (localStorage cheio ou indisponível).', 'err');
    console.error(e);
  }
}

function demoBenchmarkSeries(year, startMonth, count, annualPct){
  const arr = [];
  let val = 100;
  const monthlyRate = Math.pow(1+annualPct/100, 1/12)-1;
  for(let i=0;i<count;i++){
    const d = new Date(year, startMonth+i, 1);
    if(d>new Date()) break;
    val = val * (1+monthlyRate) * (1 + (Math.random()-0.5)*0.02);
    arr.push({ month: monthKey(fmtLocalISO(d)), value: +val.toFixed(2) });
  }
  return arr;
}

   --------------------------------------------------------------------- */
function classById(id){ return STATE.classes.find(c=>c.id===id); }
function assetById(id){ return STATE.assets.find(a=>a.id===id); }
function movementsForAsset(assetId){
  return STATE.movements.filter(m=>m.assetId===assetId).sort((a,b)=>a.date.localeCompare(b.date));
}

/* Histórico de valorização de um ativo: registos manuais de "quanto valia este ativo nesta data",
   INDEPENDENTES de movimentos de dinheiro (não são compras, vendas, reforços ou levantamentos). Servem
   apenas para reconstruir a evolução real do valor ao longo do tempo, já que a app não obtém cotações
   automaticamente. */
function valuationsForAsset(assetId){
  return STATE.valuations.filter(v=>v.assetId===assetId).sort((a,b)=>a.date.localeCompare(b.date));
}
/* Devolve a valorização manual mais recente registada para este ativo, na data indicada ou antes dela
   (ou null se não existir nenhuma). */
function valuationAsOf(assetId, date){
  const list = valuationsForAsset(assetId).filter(v=>v.date<=date);
  return list.length ? list[list.length-1] : null;
}
function upsertValuation(assetId, date, value, notes){
  const existing = STATE.valuations.find(v=>v.assetId===assetId && v.date===date);
  if(existing){ existing.value = value; existing.notes = notes||''; return existing; }
  const v = { id:uid('val'), assetId, date, value, notes: notes||'' };
  STATE.valuations.push(v);
  return v;
}

/* Calcula quantidade e preço médio processando as compras/vendas por ordem cronológica
   (método de custo médio ponderado). */
function computeQuantityAndAvgPrice(mvs){
  let qty = 0, costBasis = 0;
  mvs.forEach(m=>{
    if(m.type==='Compra'){
      qty += num(m.quantity);
      costBasis += num(m.quantity) * num(m.price);
    } else if(m.type==='Venda'){
      const sellQty = num(m.quantity);
      const avg = qty > 0 ? costBasis/qty : 0;
      costBasis -= avg * Math.min(sellQty, qty);
      qty -= sellQty;
      if(qty < 0.0000001) qty = 0;
      if(costBasis < 0) costBasis = 0;
    }
  });
  return { quantity: qty, avgPrice: qty>0 ? costBasis/qty : 0, costBasis };
}

/* Métricas completas de um ativo, com corte opcional por data (asOf) para séries temporais. */
function computeAssetMetrics(asset, asOfDate, withXirr){
  const allMvs = movementsForAsset(asset.id);
  const mvs = asOfDate ? allMvs.filter(m=>m.date<=asOfDate) : allMvs;

  const contributions = mvs.filter(m=>CONTRIB_TYPES.includes(m.type)).reduce((s,m)=>s+num(m.value),0);
  const withdrawals = mvs.filter(m=>WITHDRAW_TYPES.includes(m.type)).reduce((s,m)=>s+num(m.value),0);
  const dividends = mvs.filter(m=>m.type==='Dividendo').reduce((s,m)=>s+num(m.value),0);
  const interest = mvs.filter(m=>m.type==='Juro').reduce((s,m)=>s+num(m.value),0);
  const bonus = mvs.filter(m=>m.type===BONUS_TYPE).reduce((s,m)=>s+num(m.value),0);
  const commissions = mvs.reduce((s,m)=>s+num(m.commission),0);

  let quantity=0, avgPrice=0;
  if(usesQuantityFields(asset.classId)){
    const qa = computeQuantityAndAvgPrice(mvs);
    quantity = qa.quantity; avgPrice = qa.avgPrice;
  }

  const netInvested = Math.max(0, contributions - withdrawals);

  let currentValue;
  const isLatest = !asOfDate;
  if(isLatest){
    if(usesQuantityFields(asset.classId) && quantity>0 && num(asset.currentPrice)>0){
      currentValue = quantity * num(asset.currentPrice);
    } else {
      currentValue = num(asset.currentValue) || netInvested;
    }
  } else {
    // Para séries históricas: usa a valorização real que o utilizador tenha registado para esta data
    // (Gerir Ativos → detalhe do ativo → Histórico de valorização) sempre que exista; caso contrário,
    // aproxima ao capital líquido investido até à data (nunca inventamos uma valorização que não podemos
    // comprovar historicamente).
    const hv = valuationAsOf(asset.id, asOfDate);
    currentValue = hv ? num(hv.value) : netInvested;
  }

  const gainLoss = currentValue - netInvested;
  const returnPct = netInvested > 0 ? (gainLoss/netInvested)*100 : 0;
  // "Bónus" entra no rendimento total (é dinheiro/valor recebido) mas NUNCA em "contributions"/netInvested
  // — não foi o utilizador que colocou esse dinheiro, por isso não pode inflacionar o capital investido.
  const totalIncome = dividends + interest + bonus;
  const totalReturn = gainLoss + totalIncome - commissions;
  const totalReturnPct = netInvested > 0 ? (totalReturn/netInvested)*100 : 0;

  // Fluxos de caixa para XIRR: fluxos negativos nas contribuições, positivos nos levantamentos/rendimentos,
  // e o valor atual como fluxo final positivo. A construção dos fluxos é barata; o cálculo do XIRR em si
  // (iterativo) só é executado quando explicitamente pedido (withXirr), para não penalizar cálculos em massa
  // (ex: séries mensais com dezenas de meses × ativos), que não mostram este valor.
  const flows = [];
  mvs.forEach(m=>{
    if(CONTRIB_TYPES.includes(m.type)) flows.push({date:m.date, amount:-num(m.value)});
    else if(WITHDRAW_TYPES.includes(m.type) || m.type==='Dividendo' || m.type==='Juro' || m.type===BONUS_TYPE) flows.push({date:m.date, amount:num(m.value)});
  });
  if(currentValue > 0) flows.push({date: asOfDate || todayISO(), amount: currentValue});
  flows.sort((a,b)=>a.date.localeCompare(b.date));
  const xirr = withXirr ? computeXIRR(flows) : null;

  return {
    asset, quantity, avgPrice, contributions, withdrawals, dividends, interest, bonus, commissions,
    netInvested, currentValue, gainLoss, returnPct, totalIncome, totalReturn, totalReturnPct, xirr, flows
  };
}
/* Determina se uma classe de investimento usa o modelo "quantidade × preço" (como um ETF) ou o modelo
   de "valor atual" inserido manualmente (como P2P, PPR ou Cofre Pessoal). Isto é decidido automaticamente:
   a classe embutida ETF usa sempre quantidade; P2P, PPR, Cofre Pessoal e Outro usam sempre valor manual (tal
   como descrito nas suas secções específicas); qualquer NOVA categoria criada pelo utilizador (secção
   "Gerir Ativos → Nova categoria") herda por omissão o comportamento de quantidade/preço médio do ETF,
   por ser o mais útil para ações individuais, criptomoedas, ouro em gramas, etc. — sem exigir alterações
   ao código para o utilizador conseguir isto. */
function usesQuantityFields(classId){
  if(classId==='etf') return true;
  if(classId==='p2p' || classId==='ppr' || classId==='deposito' || classId==='outro') return false;
  const c = classById(classId);
  return !!(c && !c.system);
}

function computeAllAssetMetrics(asOfDate){
  return STATE.assets.map(a=>computeAssetMetrics(a, asOfDate, false));
}

function computePortfolioSummary(assetMetricsList){
  const list = assetMetricsList || computeAllAssetMetrics();
  const totalCurrent = list.reduce((s,m)=>s+m.currentValue,0);
  const totalInvested = list.reduce((s,m)=>s+m.netInvested,0);
  const totalGain = totalCurrent - totalInvested;
  const totalReturnPct = totalInvested>0 ? (totalGain/totalInvested)*100 : 0;
  const totalDividends = list.reduce((s,m)=>s+m.dividends,0);
  const totalInterest = list.reduce((s,m)=>s+m.interest,0);
  const totalBonus = list.reduce((s,m)=>s+(m.bonus||0),0);
  const totalIncome = totalDividends+totalInterest+totalBonus;
  const totalCommissions = list.reduce((s,m)=>s+m.commissions,0);
  const totalContributions = list.reduce((s,m)=>s+m.contributions,0);

  return { totalCurrent, totalInvested, totalGain, totalReturnPct, totalDividends, totalInterest, totalBonus, totalIncome, totalCommissions, totalContributions };
}

function computeClassBreakdown(asOfDate){
  const list = computeAllAssetMetrics(asOfDate);
  const byClass = {};
  STATE.classes.forEach(c=> byClass[c.id] = { classId:c.id, name:c.name, color:c.color, invested:0, current:0, gain:0, count:0 });
  list.forEach(m=>{
    const cid = m.asset.classId;
    if(!byClass[cid]) byClass[cid] = { classId:cid, name:cid, color:'#888', invested:0, current:0, gain:0, count:0 };
    byClass[cid].invested += m.netInvested;
    byClass[cid].current += m.currentValue;
    byClass[cid].gain += m.gainLoss;
    byClass[cid].count += 1;
  });
  const total = Object.values(byClass).reduce((s,c)=>s+c.current,0);
  Object.values(byClass).forEach(c=> c.weight = total>0 ? (c.current/total)*100 : 0);
  return Object.values(byClass);
}

function computeInstitutionBreakdown(){
  const list = computeAllAssetMetrics();
  const byInst = {};
  list.forEach(m=>{
    const inst = m.asset.institution || 'Não especificado';
    if(!byInst[inst]) byInst[inst] = { name:inst, current:0, invested:0, count:0 };
    byInst[inst].current += m.currentValue;
    byInst[inst].invested += m.netInvested;
    byInst[inst].count += 1;
  });
  const total = Object.values(byInst).reduce((s,c)=>s+c.current,0);
  Object.values(byInst).forEach(c=> c.weight = total>0 ? (c.current/total)*100 : 0);
  return Object.values(byInst).sort((a,b)=>b.current-a.current);
}

function computeCurrencyBreakdown(){
  const list = computeAllAssetMetrics();
  const byCur = {};
  list.forEach(m=>{
    const cur = m.asset.currency || 'EUR';
    if(!byCur[cur]) byCur[cur] = { name:cur, current:0 };
    byCur[cur].current += m.currentValue;
  });
  const total = Object.values(byCur).reduce((s,c)=>s+c.current,0);
  Object.values(byCur).forEach(c=> c.weight = total>0 ? (c.current/total)*100 : 0);
  return Object.values(byCur);
}

/* Série mensal para gráficos de evolução. Constrói, para cada mês desde o primeiro movimento até ao mais
   recente entre "hoje" e o último movimento registado (nunca ignora movimentos que tenha lançado, mesmo que
   tenham data posterior à data do sistema), o capital investido acumulado (exato) e o património total
   (exato apenas no mês real de hoje; nos restantes usa o capital líquido investido + rendimentos acumulados,
   já que a app não guarda cotações históricas diárias — ver tooltip "XIRR / Rentabilidade" para detalhe).
   CORREÇÃO DE AUDITORIA: os campos "dividends"/"interest"/"contributions"/"withdrawals" de cada mês
   refletem agora APENAS os movimentos desse mês específico (não o total acumulado desde o início) —
   antes usavam computeAssetMetrics com corte por data, cujo resultado é sempre cumulativo, fazendo o
   gráfico de "Rendimentos" mensal crescer indefinidamente em vez de mostrar o valor de cada mês. */
const MAX_MONTHS_SERIES = 1200; // 100 anos — limite de segurança
function computeMonthlySeries(classFilter){
  let mvs = STATE.movements.slice().filter(m => ISO_DATE_RE.test(m.date)); // ignora movimentos com data em formato inválido
  if(classFilter) mvs = mvs.filter(m=>m.classId===classFilter);
  if(!mvs.length) return [];
  mvs.sort((a,b)=>a.date.localeCompare(b.date));
  const firstMonth = monthKey(mvs[0].date);
  const todayMonth = monthKey(todayISO());
  const lastMovementMonth = monthKey(mvs[mvs.length-1].date);
  // A série tem de chegar sempre pelo menos até ao último movimento lançado — mesmo que a sua data seja
  // posterior à data do sistema (relógio do computador atrasado, ou movimentos lançados com antecedência).
  const nowMonth = lastMovementMonth > todayMonth ? lastMovementMonth : todayMonth;
  const months = [];
  let cursor = firstMonth;
  let safetyCounter = 0;
  while(cursor <= nowMonth && safetyCounter < MAX_MONTHS_SERIES){
    months.push(cursor);
    const [y,m] = cursor.split('-').map(Number);
    if(!isFinite(y) || !isFinite(m)) break; // deteta datas corrompidas e para em segurança
    const nextCursor = nextMonthKey(cursor); // aritmética inteira — nunca passa por Date/fuso horário
    if(nextCursor <= cursor) break; // nunca deixa o cursor ficar parado ou andar para trás
    cursor = nextCursor;
    safetyCounter++;
  }
  const assetsInScope = classFilter ? STATE.assets.filter(a=>a.classId===classFilter) : STATE.assets;

  // Agrupa os movimentos (já filtrados por classe, se aplicável) por mês, para calcular rendimentos/fluxos
  // incrementais de cada mês sem repetir todo o histórico em cada iteração.
  const mvsByMonth = {};
  mvs.forEach(m=>{ (mvsByMonth[monthKey(m.date)] = mvsByMonth[monthKey(m.date)] || []).push(m); });

  return months.map((mk, idx)=>{
    const [asY,asM] = mk.split('-').map(Number);
    const lastDay = new Date(asY, asM, 0).getDate();
    const asOf = `${mk}-${String(lastDay).padStart(2,'0')}`;
    // "isCurrent" corresponde SEMPRE ao mês real de hoje (relógio do sistema) — não ao último mês da série,
    // que pode ir mais além se houver movimentos com data futura. Só o mês de hoje usa o valor atual "ao
    // vivo" (quantidade×preço ou valor manual); os restantes usam sempre a aproximação histórica.
    const isCurrent = mk === todayMonth;
    let invested=0, current=0, hasRealValuation=false;
    assetsInScope.forEach(a=>{
      const met = computeAssetMetrics(a, isCurrent ? null : asOf);
      invested += met.netInvested;
      // met.currentValue já reflete, para meses passados, a valorização REAL registada pelo utilizador
      // (Histórico de valorização) quando exista para essa data, ou o capital investido como aproximação
      // honesta caso contrário — ver computeAssetMetrics.
      current += met.currentValue;
      if(!isCurrent && valuationAsOf(a.id, asOf)) hasRealValuation = true;
    });
    const monthMvs = mvsByMonth[mk] || [];
    const dividends = monthMvs.filter(m=>m.type==='Dividendo').reduce((s,m)=>s+num(m.value),0);
    const interest = monthMvs.filter(m=>m.type==='Juro').reduce((s,m)=>s+num(m.value),0);
    const bonus = monthMvs.filter(m=>m.type===BONUS_TYPE).reduce((s,m)=>s+num(m.value),0);
    const contributions = monthMvs.filter(m=>CONTRIB_TYPES.includes(m.type)).reduce((s,m)=>s+num(m.value),0);
    const withdrawals = monthMvs.filter(m=>WITHDRAW_TYPES.includes(m.type)).reduce((s,m)=>s+num(m.value),0);
    return { month: mk, label: fmtMonthLabel(mk), invested, current, dividends, interest, bonus, contributions, withdrawals, hasRealValuation: isCurrent || hasRealValuation };
  });
}

/* Reforços mensais reais (contribuições) por mês, para a Análise Mensal e Reforços. */
function computeMonthlyContributions(year){
  const map = {};
  STATE.movements.forEach(m=>{
    if(!CONTRIB_TYPES.includes(m.type)) return;
    if(year && !m.date.startsWith(String(year))) return;
    const mk = monthKey(m.date);
    map[mk] = (map[mk]||0) + num(m.value);
  });
  return map;
}

function getAvailableYears(){
  const years = new Set();
  STATE.movements.forEach(m=> years.add(m.date.slice(0,4)));
  if(!years.size) years.add(String(new Date().getFullYear()));
  return Array.from(years).sort();
}

/* Tabela de Análise Mensal para um ano específico.
   IMPORTANTE (correção de auditoria): "rentabilidade" aqui NUNCA inclui reforços nem levantamentos —
   um reforço aumenta o capital investido mas não é lucro, e um levantamento reduz o património sem ser
   necessariamente uma perda de investimento. Por isso o numerador da rentabilidade usa apenas os
   RENDIMENTOS reais do mês (juros + dividendos), nunca o dinheiro que entrou ou saiu por decisão do
   utilizador. Como a aplicação não guarda cotações históricas de mercado, não é possível também isolar
   aqui a valorização/desvalorização de mercado ocorrida especificamente nesse mês — este indicador reflete
   por isso apenas o "rendimento gerado" (yield), não a variação de valor de mercado. */
function computeMonthlyAnalysis(year){
  const rows = [];
  for(let month=1; month<=12; month++){
    const mk = `${year}-${String(month).padStart(2,'0')}`;
    const mvs = STATE.movements.filter(m=>monthKey(m.date)===mk);
    const reforços = mvs.filter(m=>CONTRIB_TYPES.includes(m.type)).reduce((s,m)=>s+num(m.value),0);
    const levantamentos = mvs.filter(m=>WITHDRAW_TYPES.includes(m.type)).reduce((s,m)=>s+num(m.value),0);
    const juros = mvs.filter(m=>m.type==='Juro').reduce((s,m)=>s+num(m.value),0);
    const dividendos = mvs.filter(m=>m.type==='Dividendo').reduce((s,m)=>s+num(m.value),0);
    const bonus = mvs.filter(m=>m.type===BONUS_TYPE).reduce((s,m)=>s+num(m.value),0);
    const comissoes = mvs.reduce((s,m)=>s+num(m.commission),0);
    const capitalInicial = rows.length ? rows[rows.length-1].capitalFinal : computeCapitalBefore(mk);
    const rendimentoMes = juros + dividendos + bonus; // NUNCA inclui reforços/levantamentos — só isto conta como "ganho" real
    const ganhosPerdas = 0; // sem cotações históricas diárias, não simulamos ganho/perda de mercado intramensal fictício
    const capitalFinal = capitalInicial + reforços - levantamentos + rendimentoMes;
    const rentabilidade = capitalInicial>0 ? (rendimentoMes/capitalInicial)*100 : (rendimentoMes>0?100:0);
    rows.push({ mk, month, capitalInicial, reforços, levantamentos, ganhosPerdas, juros, dividendos, bonus, comissoes, capitalFinal, rentabilidade,
      hasData: mvs.length>0 });
  }
  return rows;
}
function computeCapitalBefore(mk){
  const mvs = STATE.movements.filter(m=>monthKey(m.date) < mk);
  const contrib = mvs.filter(m=>CONTRIB_TYPES.includes(m.type)).reduce((s,m)=>s+num(m.value),0);
  const withdr = mvs.filter(m=>WITHDRAW_TYPES.includes(m.type)).reduce((s,m)=>s+num(m.value),0);
  const inc = mvs.filter(m=>m.type==='Juro'||m.type==='Dividendo'||m.type===BONUS_TYPE).reduce((s,m)=>s+num(m.value),0);
  return Math.max(0, contrib - withdr + inc);
}

/* Junta as linhas de computeMonthlyAnalysis de TODOS os anos com movimentos. Inclui sempre qualquer mês
   com movimentos reais lançados (hasData), mesmo que a sua data seja posterior à data do sistema — para
   nunca "perder" dados que o utilizador tenha lançado só porque o relógio do computador está atrasado ou
   porque lançou movimentos com alguma antecedência. Só exclui meses futuros SEM QUALQUER dado (linhas em
   branco geradas apenas para completar a tabela do ano). Serve de base única e consistente para "melhor
   mês" / "pior mês" (Performance) e para a "Rentabilidade do mês" (Dashboard), garantindo que ambos usam
   sempre exatamente a mesma fórmula que a página de Análise Mensal — ver nota em computeMonthlyAnalysis. */
function computeAllMonthlyRows(){
  const nowMk = monthKey(todayISO());
  let rows = [];
  getAvailableYears().forEach(y=>{
    computeMonthlyAnalysis(y).forEach(r=>{ if(r.mk <= nowMk || r.hasData) rows.push(r); });
  });
  return rows;
}

/* Rentabilidade do ANO CORRENTE (ou de um ano específico), calculada com a mesma lógica que a Análise
   Mensal: apenas com base nos RENDIMENTOS (juros + dividendos) recebidos durante o ano, em relação ao
   capital que já estava investido ANTES do início do ano. Reforços e levantamentos feitos durante o
   próprio ano ficam deliberadamente de fora do numerador, para nunca serem confundidos com rentabilidade
   (ver também a nota em computeMonthlyAnalysis sobre a limitação de não existirem cotações históricas). */
function computeYearReturn(year){
  const capitalInicialAno = computeCapitalBefore(`${year}-01`);
  const income = STATE.movements
    .filter(m=> ISO_DATE_RE.test(m.date) && m.date.startsWith(String(year)) && (m.type==='Juro' || m.type==='Dividendo'))
    .reduce((s,m)=>s+num(m.value),0);
  const pct = capitalInicialAno>0 ? (income/capitalInicialAno)*100 : (income>0 ? 100 : 0);
  return { capitalInicialAno, income, pct };
}

/* Drawdown sobre a série mensal de património */
function computeDrawdown(series){
  let peak = -Infinity, maxDD = 0, maxDDStart=null, maxDDEnd=null, curPeakMonth=null;
  const dd = series.map(pt=>{
    if(pt.current > peak){ peak = pt.current; curPeakMonth = pt.month; }
    const d = peak>0 ? ((pt.current-peak)/peak)*100 : 0;
    if(d < maxDD){ maxDD = d; maxDDStart = curPeakMonth; maxDDEnd = pt.month; }
    return { month:pt.month, label:pt.label, drawdown:d };
  });
  const current = dd.length ? dd[dd.length-1].drawdown : 0;
  return { series: dd, maxDrawdown: maxDD, maxDrawdownStart:maxDDStart, maxDrawdownEnd:maxDDEnd, current };
}

/* Alertas ativos calculados com base nas definições do utilizador */
function computeActiveAlerts(){
  const active = [];
  const cfg = {}; STATE.alerts.forEach(a=> cfg[a.type] = a);
  const classBreak = computeClassBreakdown();
  const assetMetrics = computeAllAssetMetrics();
  const summary = computePortfolioSummary(assetMetrics);

  if(cfg.asset_weight && cfg.asset_weight.active){
    assetMetrics.forEach(m=>{
      const w = summary.totalCurrent>0 ? (m.currentValue/summary.totalCurrent)*100 : 0;
      if(w > num(cfg.asset_weight.threshold)){
        active.push({level:'warn', text:`${m.asset.name} representa ${fmtPct(w,1).replace('+','')} do património (limite: ${cfg.asset_weight.threshold}%).`});
      }
    });
  }
  if(cfg.class_weight && cfg.class_weight.active){
    classBreak.forEach(c=>{
      if(c.weight > num(cfg.class_weight.threshold)){
        active.push({level:'warn', text:`A classe ${c.name} representa ${fmtPct(c.weight,1).replace('+','')} do património (limite: ${cfg.class_weight.threshold}%).`});
      }
    });
  }
  if(cfg.negative_return && cfg.negative_return.active){
    assetMetrics.forEach(m=>{
      if(m.netInvested>0 && m.returnPct < num(cfg.negative_return.threshold)){
        active.push({level:'crit', text:`${m.asset.name} está com rentabilidade negativa (${fmtPct(m.returnPct,1)}).`});
      }
    });
  }
  if(cfg.drawdown && cfg.drawdown.active){
    const dd = computeDrawdown(computeMonthlySeries());
    if(Math.abs(dd.current) > num(cfg.drawdown.threshold)){
      active.push({level:'crit', text:`Drawdown atual de ${fmtPct(dd.current,1)}, acima do limite de ${cfg.drawdown.threshold}%.`});
    }
  }
  if(cfg.deposit_maturity && cfg.deposit_maturity.active){
    STATE.assets.filter(a=>a.classId==='deposito' && a.extra && a.extra.dataVencimento).forEach(a=>{
      const days = daysBetween(todayISO(), a.extra.dataVencimento);
      if(days >= 0 && days <= num(cfg.deposit_maturity.threshold)){
        active.push({level:'warn', text:`O ativo do Cofre Pessoal "${a.name}" vence dentro de ${Math.round(days)} dias (${fmtDate(a.extra.dataVencimento)}).`});
      }
    });
  }
  STATE.assets.filter(a=>a.classId==='p2p' && a.extra && a.extra.atraso).forEach(a=>{
    active.push({level:'crit', text:`A plataforma P2P "${a.name}" tem capital em atraso / default assinalado.`});
  });
  return active;
}

/* Chart.js é carregado com "defer" (não bloqueia a abertura da aplicação). Enquanto a biblioteca não
   estiver disponível, cada gráfico mostra um aviso em vez de bloquear ou rebentar a app; assim que
   carrega, window.__chartLoaded() (chamado pelo atributo onload da tag <script>) marca-a como pronta
   e volta a desenhar a página atual para os gráficos aparecerem — tudo o resto (cartões, tabelas,
   valores, navegação) já está visível muito antes disso. */
let CHART_READY = (typeof Chart !== 'undefined');
function safeMakeChart(ctxEl, config){
  if(!ctxEl) return null;
  if(typeof Chart === 'undefined'){
    if(ctxEl.parentElement) ctxEl.parentElement.innerHTML = emptyChartHTML('A carregar biblioteca de gráficos…');
    return null;
  }
  return new Chart(ctxEl, config);
}
window.__chartLoaded = function(){
  if(CHART_READY) return;
  CHART_READY = true;
  Chart.defaults.font.family = "system-ui,-apple-system,'Segoe UI',Roboto,sans-serif";
  Chart.defaults.font.size = 11.5;
  if(document.readyState !== 'loading' && typeof CURRENT_PAGE !== 'undefined' && document.getElementById('pageRoot')){
    navigate(CURRENT_PAGE); // reconstrói a página atual para os gráficos aparecerem
  }
};

/* Aplica o período do filtro global a uma lista de datas ISO, devolvendo [from,to] ou null */
function periodRange(){
  const today = new Date();
  const to = todayISO();
  let from = null;
  switch(FILTERS.period){
    case 'month': from = new Date(today.getFullYear(), today.getMonth(), 1); break;
    case '3m': from = new Date(today.getFullYear(), today.getMonth()-2, 1); break;
    case '6m': from = new Date(today.getFullYear(), today.getMonth()-5, 1); break;
    case 'year': from = new Date(today.getFullYear(), 0, 1); break;
    case '12m': from = new Date(today.getFullYear(), today.getMonth()-11, 1); break;
    default: from = null;
  }
  return { from: from ? fmtLocalISO(from) : null, to };
}
function filteredMovements(){
  const {from,to} = periodRange();
  return STATE.movements.filter(m=>{
    if(from && m.date < from) return false;
    if(to && m.date > to) return false;
    if(FILTERS.classId && m.classId !== FILTERS.classId) return false;
    if(FILTERS.assetId && m.assetId !== FILTERS.assetId) return false;
    if(FILTERS.institution && m.institution !== FILTERS.institution) return false;
    if(FILTERS.currency && m.currency !== FILTERS.currency) return false;
    return true;
  });
}
function filteredAssets(){
  return STATE.assets.filter(a=>{
    if(FILTERS.classId && a.classId !== FILTERS.classId) return false;
    if(FILTERS.assetId && a.id !== FILTERS.assetId) return false;
    if(FILTERS.institution && a.institution !== FILTERS.institution) return false;
    if(FILTERS.currency && a.currency !== FILTERS.currency) return false;
    return true;
  });
}

function openModal(html, opts){
  opts = opts || {};
  const overlay = document.getElementById('modalOverlay');
  const box = document.getElementById('modalBox');
  box.className = 'modal' + (opts.wide ? ' wide' : '');
  box.innerHTML = html;
  overlay.classList.add('open');
  overlay.onclick = (e)=>{ if(e.target===overlay && !opts.persistent) closeModal(); };
  const closeBtn = box.querySelector('.modal-close');
  if(closeBtn) closeBtn.onclick = closeModal;
  document.addEventListener('keydown', escCloseHandler);
}
function escCloseHandler(e){ if(e.key==='Escape') closeModal(); }
function closeModal(){
  document.getElementById('modalOverlay').classList.remove('open');
  document.removeEventListener('keydown', escCloseHandler);
}

function drawEvolutionChart(range){
  destroyChart('evolution');
  let series = computeMonthlySeries();
  if(range && range.startsWith('y:')){
    const year = range.slice(2);
    series = series.filter(s=>s.month.startsWith(year));
  } else if(range !== 'all'){
    series = series.slice(-parseInt(range));
  }
  const c = chartColors();
  const ctx = document.getElementById('chartEvolution');
  if(!ctx) return;
  if(!series.length){ ctx.parentElement.innerHTML = emptyChartHTML('Sem movimentos suficientes para traçar a evolução.'); return; }
  CHART_REGISTRY['evolution'] = safeMakeChart(ctx, {
    type:'line',
    data:{ labels: series.map(s=>s.label), datasets:[
      { label:'Património total', data:series.map(s=>s.current), borderColor:c.accent, backgroundColor:c.accent+'22', fill:true, tension:.3, pointRadius:2 },
      { label:'Capital investido', data:series.map(s=>s.invested), borderColor:c.inkFaint, borderDash:[5,4], fill:false, tension:.3, pointRadius:0 },
    ]},
    options: baseChartOptions(c, {currency:true})
  });
}
function drawClassPieChart(canvasId, asOf){
  destroyChart('classPie'+(canvasId||''));
  const c = chartColors();
  const breakdown = computeClassBreakdown(asOf).filter(x=>x.current>0.004);
  const ctx = document.getElementById(canvasId);
  if(!ctx) return;
  if(!breakdown.length){ ctx.parentElement.innerHTML = emptyChartHTML('Ainda sem ativos com valor.'); return; }
  CHART_REGISTRY['classPie'+(canvasId||'')] = safeMakeChart(ctx, {
    type:'doughnut',
    data:{ labels: breakdown.map(b=>b.name), datasets:[{ data: breakdown.map(b=>b.current), backgroundColor: breakdown.map((b,i)=>c.palette[i%c.palette.length]), borderWidth:2, borderColor: cssVar('--bg-elevated') }]},
    options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{position:'bottom', labels:{color:c.inkSoft, boxWidth:10, padding:12}},
      tooltip:{ callbacks:{ label: (ctx)=> ` ${ctx.label}: ${fmtMoney(ctx.parsed)} (${((ctx.parsed/breakdown.reduce((s,b)=>s+b.current,0))*100).toFixed(1)}%)` } } } }
  });
}
function drawInvestedVsCurrentChart(assetMetrics){
  destroyChart('investedVsCurrent');
  const c = chartColors();
  const breakdown = computeClassBreakdown();
  const ctx = document.getElementById('chartInvestedVsCurrent');
  if(!ctx) return;
  if(!breakdown.some(b=>b.current>0||b.invested>0)){ ctx.parentElement.innerHTML = emptyChartHTML('Sem dados.'); return; }
  CHART_REGISTRY['investedVsCurrent'] = safeMakeChart(ctx, {
    type:'bar',
    data:{ labels: breakdown.map(b=>b.name), datasets:[
      { label:'Capital investido', data: breakdown.map(b=>b.invested), backgroundColor:c.inkFaint+'aa', borderRadius:5 },
      { label:'Valor atual', data: breakdown.map(b=>b.current), backgroundColor:c.accent, borderRadius:5 },
    ]},
    options: baseChartOptions(c, {currency:true})
  });
}
function drawAssetBarChart(assetMetrics){
  destroyChart('assetBar');
  const c = chartColors();
  const top = assetMetrics.slice().sort((a,b)=>b.currentValue-a.currentValue).slice(0,8);
  const ctx = document.getElementById('chartAssetBar');
  if(!ctx) return;
  if(!top.length || !top.some(t=>t.currentValue>0)){ ctx.parentElement.innerHTML = emptyChartHTML('Sem dados.'); return; }
  CHART_REGISTRY['assetBar'] = safeMakeChart(ctx, {
    type:'bar',
    data:{ labels: top.map(t=>t.asset.name), datasets:[{ label:'Valor atual', data: top.map(t=>t.currentValue), backgroundColor:c.palette, borderRadius:5 }]},
    options: Object.assign(baseChartOptions(c, {currency:true}), { indexAxis:'y', plugins:{legend:{display:false}} })
  });
}
function emptyChartHTML(msg){ return `<div class="empty-state" style="padding:30px;"><div class="icon">📊</div><p>${msg}</p></div>`; }
function baseChartOptions(c, opts){
  opts = opts || {};
  return {
    responsive:true, maintainAspectRatio:false,
    interaction:{ mode:'index', intersect:false },
    scales:{
      x:{ grid:{ color:c.grid, display:false }, ticks:{ color:c.inkFaint } },
      y:{ grid:{ color:c.grid }, ticks:{ color:c.inkFaint, callback:(v)=> opts.currency ? fmtCompact(v) : v } }
    },
    plugins:{
      legend:{ position:'bottom', labels:{ color:c.inkSoft, boxWidth:10, padding:12 } },
      tooltip:{ callbacks:{ label:(ctx)=> ` ${ctx.dataset.label}: ${opts.currency ? fmtMoney(ctx.parsed.y!==undefined?ctx.parsed.y:ctx.parsed.x) : ctx.formattedValue}` } }
    }
  };
}
function fmtCompact(v){
  if(Math.abs(v)>=1000) return (v/1000).toFixed(v%1000===0?0:1)+'k€';
  return v+'€';
}

function handleDeleteAsset(assetId){
  const asset = assetById(assetId);
  if(!asset) return;
  const hasMovements = STATE.movements.some(m=>m.assetId===assetId);
  const hasValuations = STATE.valuations.some(v=>v.assetId===assetId);
  const msg = (hasMovements || hasValuations)
    ? `O ativo <strong>${escapeHtml(asset.name)}</strong> tem ${hasMovements?'movimentos':''}${hasMovements&&hasValuations?' e ':''}${hasValuations?'histórico de valorização':''} associados. Ao eliminar, isso será também apagado permanentemente. Esta ação não pode ser desfeita.`
    : `Tem a certeza que quer eliminar <strong>${escapeHtml(asset.name)}</strong>?`;
  confirmDialog('Eliminar ativo', msg, ()=>{
    STATE.assets = STATE.assets.filter(a=>a.id!==assetId);
    STATE.movements = STATE.movements.filter(m=>m.assetId!==assetId);
    STATE.valuations = STATE.valuations.filter(v=>v.assetId!==assetId);
    STATE.isDemo = false;
    saveState();
    toast('Ativo eliminado.', 'ok');
    navigate(CURRENT_PAGE);
  }, true);
}

/* Formulário de criação/edição de uma valorização histórica — ver nota em openAssetDetailModal sobre a
   diferença entre isto e um Movimento. */
function openValuationModal(asset, existing){
  const isEdit = !!existing;
  const v = existing || { date: todayISO(), value:'' };
  openModal(`
    <div class="modal-header"><h3>${isEdit?'Editar':'Adicionar'} valorização</h3><button class="modal-close">${icon('x',18)}</button></div>
    <div class="modal-body">
      <p class="muted" style="font-size:12.5px;margin:0 0 14px;line-height:1.5;">
        Regista quanto <strong>${escapeHtml(asset.name)}</strong> valia nesta data. Isto NÃO move dinheiro nem altera o capital investido — para depósitos, levantamentos, compras ou vendas, use Movimentos.
      </p>
      <div class="form-grid single">
        <div class="field"><label>Data *</label><input type="date" id="vfDate" value="${v.date}" max="${todayISO()}"></div>
        <div class="field"><label>Valor nesta data (${asset.currency}) *</label><input type="number" step="0.01" class="num-input" id="vfValue" value="${v.value!==undefined && v.value!==''?v.value:''}"></div>
      </div>
      <div class="field-error" id="err-vf"></div>
    </div>
    <div class="modal-footer">
      <button class="btn" id="vfCancel">Cancelar</button>
      ${isEdit ? `<button class="btn btn-danger" id="vfDelete">Eliminar</button>` : ''}
      <button class="btn btn-primary" id="vfSave">${isEdit?'Guardar alterações':'Adicionar'}</button>
    </div>`);
  document.getElementById('vfCancel').onclick = ()=>{ closeModal(); openAssetDetailModal(asset); };
  if(isEdit){
    document.getElementById('vfDelete').onclick = ()=>{
      STATE.valuations = STATE.valuations.filter(vv=>vv.id!==existing.id);
      saveState();
      toast('Valorização eliminada.', 'ok');
      closeModal();
      openAssetDetailModal(asset);
    };
  }
  document.getElementById('vfSave').onclick = ()=>{
    const date = document.getElementById('vfDate').value;
    const rawValue = document.getElementById('vfValue').value;
    const errEl = document.getElementById('err-vf');
    if(!ISO_DATE_RE.test(date)){ errEl.textContent = 'Indique uma data válida.'; return; }
    if(date > todayISO()){ errEl.textContent = 'A data não pode ser no futuro.'; return; }
    if(rawValue === '' || isNaN(num(rawValue))){ errEl.textContent = 'Indique um valor válido.'; return; }
    errEl.textContent = '';
    if(isEdit && existing.date !== date){
      // se a data foi alterada, remove o registo antigo para não ficar duplicado na nova data
      STATE.valuations = STATE.valuations.filter(vv=>vv.id!==existing.id);
    }
    upsertValuation(asset.id, date, num(rawValue));
    STATE.isDemo = false;
    saveState();
    toast('Valorização guardada.', 'ok');
    closeModal();
    openAssetDetailModal(asset);
  };
}

/* ---------------------------------------------------------------------

function openAssetModal(existingAsset, presetClassId){
  const isEdit = !!existingAsset;
  const classId = existingAsset ? existingAsset.classId : (presetClassId || STATE.classes[0].id);
  const a = existingAsset || { id:null, name:'', ticker:'', isin:'', institution:'', currency: STATE.settings.baseCurrency, firstDate: todayISO(), currentValue:0, currentPrice:0, notes:'', extra:{} };

  const showQtyFields = usesQuantityFields(classId);
  const extraFields = classId==='deposito' ? `
    <div class="field"><label>Data de vencimento</label><input type="date" id="afVencimento" value="${a.extra && a.extra.dataVencimento || ''}"></div>
    <div class="field"><label>Taxa de juro anual (%)</label><input type="number" step="0.01" class="num-input" id="afTaxa" value="${a.extra && a.extra.taxaJuro || ''}"></div>
  ` : classId==='p2p' ? `
    <div class="field span2 checkbox-row"><input type="checkbox" id="afAtraso" ${a.extra && a.extra.atraso ? 'checked':''}><label for="afAtraso" style="margin:0;">Existe capital em atraso / default nesta plataforma</label></div>
  ` : showQtyFields ? `
    <div class="field"><label>Preço atual por unidade <span class="tooltip-i" data-tip="Usado para calcular automaticamente o valor atual = quantidade × preço atual. Deixe em branco para introduzir o valor atual manualmente.">i</span></label><input type="number" step="0.0001" class="num-input" id="afPrecoAtual" value="${a.currentPrice||''}"></div>
  ` : '';

  openModal(`
    <div class="modal-header"><h3>${isEdit?'Editar':'Adicionar'} ativo</h3><button class="modal-close">${icon('x',18)}</button></div>
    <div class="modal-body">
      <form id="assetForm">
        <div class="form-grid">
          <div class="field span2">
            <label>Classe de investimento</label>
            <select id="afClass" ${isEdit?'disabled':''}>${STATE.classes.map(c=>`<option value="${c.id}" ${c.id===classId?'selected':''}>${escapeHtml(c.name)}</option>`).join('')}</select>
          </div>
          <div class="field span2">
            <label>Nome ${classId==='p2p'?'/ Plataforma':''} *</label>
            <input type="text" id="afName" value="${escapeHtml(a.name)}" placeholder="Ex: iShares Core S&P 500">
            <div class="field-error" id="err-afName"></div>
          </div>
          ${showQtyFields ? `
          <div class="field"><label>Ticker</label><input type="text" id="afTicker" value="${escapeHtml(a.ticker||'')}" placeholder="SXR8"></div>
          <div class="field"><label>ISIN</label><input type="text" id="afIsin" value="${escapeHtml(a.isin||'')}" placeholder="IE00B5BMR087"></div>` : ''}
          <div class="field"><label>Instituição ${classId==='deposito'?'(banco / local)':classId==='p2p'?'(plataforma)':'(corretora)'}</label><input type="text" id="afInstitution" value="${escapeHtml(a.institution||'')}"></div>
          <div class="field"><label>Moeda</label>
            <select id="afCurrency">${Object.keys(CURRENCY_SYMBOLS).map(c=>`<option value="${c}" ${c===a.currency?'selected':''}>${c}</option>`).join('')}</select>
          </div>
          <div class="field"><label>Data da primeira operação</label><input type="date" id="afDate" value="${a.firstDate||todayISO()}"></div>
          ${!showQtyFields ? `<div class="field"><label>Valor atual ${classId==='deposito'?'(capital)':''} <span class="tooltip-i" data-tip="Atualize manualmente sempre que quiser refletir o valor de mercado mais recente. A aplicação não obtém cotações automaticamente.">i</span></label><input type="number" step="0.01" class="num-input" id="afCurrentValue" value="${a.currentValue||''}"></div>` : `<div class="field"><label>Valor atual (alternativa manual) <span class="tooltip-i" data-tip="Só é usado se não preencher o 'Preço atual por unidade' acima. Útil se ainda não souber a cotação exata.">i</span></label><input type="number" step="0.01" class="num-input" id="afCurrentValue" value="${a.currentValue||''}"></div>`}
          ${extraFields}
          <div class="field span2"><label>Observações</label><textarea id="afNotes">${escapeHtml(a.notes||'')}</textarea></div>
        </div>

    </div>
    <div class="modal-footer">
      <button class="btn" id="afCancel">Cancelar</button>
      <button class="btn btn-primary" id="afSave">${isEdit?'Guardar alterações':'Adicionar ativo'}</button>
    </div>`);

  document.getElementById('afCancel').onclick = closeModal;
  if(!isEdit){
    document.getElementById('afClass').onchange = (e)=>{ closeModal(); openAssetModal(null, e.target.value); };
  }
  document.getElementById('afSave').onclick = ()=>{
    const name = document.getElementById('afName').value.trim();
    const errEl = document.getElementById('err-afName');
    if(!name){ errEl.textContent = 'O nome é obrigatório.'; document.getElementById('afName').classList.add('invalid'); return; }
    errEl.textContent=''; document.getElementById('afName').classList.remove('invalid');

    const curClassId = isEdit ? classId : document.getElementById('afClass').value;
    const extra = existingAsset ? Object.assign({}, existingAsset.extra) : {};
    if(curClassId==='deposito'){ extra.dataVencimento = document.getElementById('afVencimento').value; extra.taxaJuro = num(document.getElementById('afTaxa').value); }
    if(curClassId==='p2p'){ extra.atraso = document.getElementById('afAtraso').checked; }

    const payload = {
      name, ticker: document.getElementById('afTicker') ? document.getElementById('afTicker').value.trim() : '',
      isin: document.getElementById('afIsin') ? document.getElementById('afIsin').value.trim() : '',
      institution: document.getElementById('afInstitution').value.trim(),
      currency: document.getElementById('afCurrency').value,
      firstDate: document.getElementById('afDate').value || todayISO(),
      currentValue: document.getElementById('afCurrentValue') ? num(document.getElementById('afCurrentValue').value) : (existingAsset?existingAsset.currentValue:0),
      currentPrice: document.getElementById('afPrecoAtual') ? num(document.getElementById('afPrecoAtual').value) : (existingAsset?existingAsset.currentPrice:0),
      notes: document.getElementById('afNotes').value.trim(),
      extra,
    };
    if(isEdit){
      Object.assign(existingAsset, payload);
      toast('Ativo atualizado.', 'ok');
    } else {
      STATE.assets.push(Object.assign({id:uid('asset'), classId:curClassId}, payload));
      toast('Ativo adicionado.', 'ok');
    }
    STATE.isDemo = false;
    saveState();
    closeModal();
    navigate(CURRENT_PAGE);
  };
}

function openMovementModal(existingMovement, preset){
  preset = preset || {};
  const isEdit = !!existingMovement;
  const mv = existingMovement || {
    id:null, date: todayISO(), type: preset.type || 'Compra', classId: preset.classId || (STATE.assets[0]?STATE.assets[0].classId:'etf'),
    assetId: preset.assetId || (STATE.assets[0]?STATE.assets[0].id:''), institution:'', quantity:0, price:0, value:0, commission:0,
    currency: STATE.settings.baseCurrency, notes:''
  };
  if(!STATE.assets.length){
    openModal(`<div class="modal-header"><h3>Novo movimento</h3><button class="modal-close">${icon('x',18)}</button></div>
      <div class="modal-body"><div class="empty-state"><div class="icon">＋</div><h4>Ainda não tem ativos</h4><p>Crie primeiro um ativo em "Gerir Ativos" para poder registar movimentos.</p></div></div>
      <div class="modal-footer"><button class="btn btn-primary" id="goManage">Ir para Gerir Ativos</button></div>`);

    return;
  }
  const renderAssetOptions = (classId)=> STATE.assets.filter(a=>a.classId===classId).map(a=>`<option value="${a.id}" ${a.id===mv.assetId?'selected':''}>${escapeHtml(a.name)}</option>`).join('');

  openModal(`

    <div class="modal-body">
      <div class="form-grid">
        <div class="field"><label>Data *</label><input type="date" id="mfDate" value="${mv.date}"></div>
        <div class="field"><label>Tipo *</label><select id="mfType">${MOVEMENT_TYPES.map(t=>`<option value="${t}" ${t===mv.type?'selected':''}>${t}</option>`).join('')}</select></div>
        <div class="field"><label>Classe *</label><select id="mfClass">${STATE.classes.map(c=>`<option value="${c.id}" ${c.id===mv.classId?'selected':''}>${escapeHtml(c.name)}</option>`).join('')}</select></div>
        <div class="field"><label>Ativo *</label><select id="mfAsset">${renderAssetOptions(mv.classId)}</select></div>
        <div class="field"><label>Instituição</label><input type="text" id="mfInstitution" value="${escapeHtml(mv.institution||'')}"></div>
        <div class="field"><label>Moeda</label><select id="mfCurrency">${Object.keys(CURRENCY_SYMBOLS).map(c=>`<option value="${c}" ${c===mv.currency?'selected':''}>${c}</option>`).join('')}</select></div>
        <div class="field"><label>Quantidade</label><input type="number" step="0.0001" class="num-input" id="mfQty" value="${mv.quantity||''}"></div>
        <div class="field"><label>Preço unitário</label><input type="number" step="0.0001" class="num-input" id="mfPrice" value="${mv.price||''}"></div>
        <div class="field"><label>Valor total * <span class="tooltip-i" data-tip="Se preencher quantidade e preço, este campo é calculado automaticamente — mas pode sempre editar manualmente.">i</span></label><input type="number" step="0.01" class="num-input" id="mfValue" value="${mv.value||''}"></div>
        <div class="field"><label>Comissão</label><input type="number" step="0.01" class="num-input" id="mfCommission" value="${mv.commission||''}"></div>
        <div class="field span2"><label>Observações</label><textarea id="mfNotes">${escapeHtml(mv.notes||'')}</textarea></div>
        <div class="field-error span2" id="err-mf"></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" id="mfCancel">Cancelar</button>
      <button class="btn btn-primary" id="mfSave">${isEdit?'Guardar alterações':'Registar movimento'}</button>
    </div>`);

  document.getElementById('mfClass').onchange = (e)=>{ document.getElementById('mfAsset').innerHTML = renderAssetOptions(e.target.value); };
  const qtyEl = document.getElementById('mfQty'), priceEl = document.getElementById('mfPrice'), valueEl = document.getElementById('mfValue');
  function autoCalc(){ const q=num(qtyEl.value), p=num(priceEl.value); if(q && p) valueEl.value = +(q*p).toFixed(2); }
  qtyEl.oninput = autoCalc; priceEl.oninput = autoCalc;
  document.getElementById('mfCancel').onclick = closeModal;
  document.getElementById('mfSave').onclick = ()=>{
    const assetSel = document.getElementById('mfAsset');
    if(!assetSel.value){ document.getElementById('err-mf').textContent = 'Selecione um ativo válido para esta classe.'; return; }
    const value = num(valueEl.value);
    if(!value && document.getElementById('mfType').value !== 'Transferência'){
      document.getElementById('err-mf').textContent = 'Indique o valor do movimento.'; return;
    }
    document.getElementById('err-mf').textContent = '';
    const payload = {
      date: document.getElementById('mfDate').value || todayISO(),

      classId: document.getElementById('mfClass').value,

      notes: document.getElementById('mfNotes').value.trim(),

    else { STATE.movements.push(Object.assign({id:uid('mv')}, payload)); toast('Movimento registado.', 'ok'); }
    STATE.isDemo = false;
    saveState();
    closeModal();
    navigate(CURRENT_PAGE);
  };
}

function renderInvestimentos(root){

function renderInvestTable(){
  const container = document.getElementById('investTableWrap');
  if(!container) return;
  let list = computeAllAssetMetrics().filter(m => filteredAssets().some(a=>a.id===m.asset.id));
  if(INVEST_SEARCH){
    list = list.filter(m => (m.asset.name+m.asset.institution+m.asset.ticker).toLowerCase().includes(INVEST_SEARCH));
  }
  const total = list.reduce((s,m)=>s+m.currentValue,0);
  const sortMap = { asset:'asset.name', class:'asset.classId', institution:'asset.institution', invested:'netInvested', current:'currentValue', gain:'gainLoss', pct:'returnPct' };
  list.sort((a,b)=>{
    const path = sortMap[INVEST_SORT.col].split('.');
    let va=a, vb=b; path.forEach(p=>{ va=va[p]; vb=vb[p]; });
    if(typeof va === 'string') return va.localeCompare(vb) * INVEST_SORT.dir;
    return (va-vb) * INVEST_SORT.dir;
  });
  if(!list.length){
    container.innerHTML = `<div class="empty-state"><div class="icon">🔍</div><h4>Nenhum investimento encontrado</h4><p>Ajuste os filtros ou adicione um novo ativo.</p></div>`;
    return;
  }
  const arrow = (col)=> INVEST_SORT.col===col ? `<span class="arrow">${INVEST_SORT.dir===1?'▲':'▼'}</span>` : '';
  container.innerHTML = `
    <div class="table-wrap"><table>
      <thead><tr>
        <th data-sort="asset">Ativo${arrow('asset')}</th>
        <th data-sort="class">Classe${arrow('class')}</th>
        <th data-sort="institution">Instituição${arrow('institution')}</th>
        <th class="num" data-sort="invested">Investido${arrow('invested')}</th>
        <th class="num" data-sort="current">Valor Atual${arrow('current')}</th>
        <th class="num" data-sort="gain">Ganho/Perda${arrow('gain')}</th>
        <th class="num" data-sort="pct">Rentabilidade${arrow('pct')}</th>
        <th class="num">Peso</th><th></th>
      </tr></thead>
      <tbody>
        ${list.map(m=>{
          const weight = total>0 ? (m.currentValue/total)*100 : 0;
          return `<tr>
            <td><strong>${escapeHtml(m.asset.name)}</strong></td>
            <td>${badgeForClass(m.asset.classId)}</td>
            <td>${escapeHtml(m.asset.institution||'—')}</td>
            <td class="num">${fmtMoney(m.netInvested,m.asset.currency)}</td>
            <td class="num">${fmtMoney(m.currentValue,m.asset.currency)}</td>
            <td class="num ${m.gainLoss>=0?'pos':'neg'}">${fmtMoney(m.gainLoss,m.asset.currency)}</td>
            <td class="num ${m.returnPct>=0?'pos':'neg'}">${fmtPct(m.returnPct)}</td>
            <td class="num">${weight.toFixed(1)}%</td>
            <td><button class="btn btn-sm btn-icon" data-view="${m.asset.id}">${icon('bar',14)}</button>
                <button class="btn btn-sm btn-icon" data-edit="${m.asset.id}">${icon('edit',14)}</button>
                <button class="btn btn-sm btn-icon" data-del="${m.asset.id}">${icon('trash',14)}</button></td>
          </tr>`;
        }).join('')}
      </tbody>
    </table></div>`;
  container.querySelectorAll('th[data-sort]').forEach(th=>{
    th.onclick = ()=>{ const col=th.dataset.sort; if(INVEST_SORT.col===col) INVEST_SORT.dir*=-1; else INVEST_SORT={col,dir:1}; renderInvestTable(); };
  });
  container.querySelectorAll('[data-edit]').forEach(b=> b.onclick = ()=> openAssetModal(assetById(b.dataset.edit), null));
  container.querySelectorAll('[data-view]').forEach(b=> b.onclick = ()=> openAssetDetailModal(assetById(b.dataset.view)));
  container.querySelectorAll('[data-del]').forEach(b=> b.onclick = ()=> handleDeleteAsset(b.dataset.del));
}
function exportAssetsCsv(){
  const rows = [['Ativo','Classe','Instituicao','Moeda','Investido','ValorAtual','GanhoPerda','Rentabilidade(%)']];
  computeAllAssetMetrics().forEach(m=>{
    rows.push([m.asset.name, (classById(m.asset.classId)||{}).name||m.asset.classId, m.asset.institution||'', m.asset.currency,
      m.netInvested.toFixed(2), m.currentValue.toFixed(2), m.gainLoss.toFixed(2), m.returnPct.toFixed(2)]);
  });
  downloadCsv(rows, 'investimentos.csv');
}
function downloadCsv(rows, filename){
  const csv = rows.map(r=> r.map(v=> `"${String(v).replace(/"/g,'""')}"`).join(';')).join('\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('Exportação concluída.', 'ok');
}
